<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520"><title>Button: размер, толщина и материал</title><rect width="960" height="520" rx="16" fill="#f3f7f8"/><g font-family="Segoe UI,Arial" fill="#243746"><text x="32" y="55" font-size="32">Button</text><text x="32" y="95" font-size="20">Урок 27 · учебная схема, не скриншот MD</text><rect x="100" y="150" width="300" height="240" rx="8" fill="#d7eeeb" stroke="#157e82" stroke-width="3"/><rect x="550" y="150" width="300" height="240" rx="8" fill="#d7eeeb" stroke="#157e82" stroke-width="3"/><circle cx="250" cy="270" r="44" fill="#d97a26" stroke="#754c29" stroke-width="3"/><circle cx="700" cy="270" r="44" fill="#d97a26" stroke="#754c29" stroke-width="3"/><circle cx="240" cy="270" r="5" fill="#fff"/><circle cx="260" cy="270" r="5" fill="#fff"/><circle cx="690" cy="270" r="5" fill="#fff"/><circle cx="710" cy="270" r="5" fill="#fff"/><text x="100" y="435" font-size="23">Button</text><text x="550" y="435" font-size="23">Width ≠ Weight</text><text x="32" y="490" font-size="19">Оранжевый цвет выделяет деталь или действие. Масштаб условный.</text></g></svg>